<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能理包 — 九小卿攻略站</title>
<meta name="description" content="九小卿智能理包攻略">
<link rel="icon" type="image/jpeg" href="art/favicon.jpg">
<style>
  :root{
    --bg:#fff;--ink:#16130f;--muted:#6f675c;--card:#ffffff;
    --pink:#ff4d8d;--blue:#4d7cff;--violet:#8b5cf6;--lime:#cdf05a;
    --orange:#ff8a3d;--gold:#f59e0b;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;scrollbar-gutter:stable}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.8;overflow-x:hidden}
  ::selection{background:var(--pink);color:#fff}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:960px;margin:0 auto;padding:32px 24px 60px}
  .back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--card);border:1.5px solid rgba(22,19,15,.12);color:var(--ink);font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s}
  .back-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,19,15,.12);border-color:var(--pink)}
  .back-btn svg{width:18px;height:18px}
  .page-title{text-align:center;margin:40px 0 48px}
  .page-title h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:.02em;background:linear-gradient(135deg,var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .footer{text-align:center;padding:40px 0;color:var(--muted);font-size:.85rem}
  .section{margin-bottom:24px}
  .purple-header{background:#f3e8ff;padding:12px 18px;margin:24px 0 16px;font-size:1.2rem;font-weight:700;color:var(--ink);border-radius:8px}
  .doc-text{margin:8px 0 0 0;font-size:.95rem;line-height:1.8;color:#333}
  .doc-img{margin:0 0 12px 0;text-align:center}
  .doc-img img{max-width:100%;border-radius:8px;display:inline-block}
  @media (max-width:640px){
    .wrap{padding:24px 16px}
    .page-title{margin:24px 0 32px}
    .doc-text{font-size:.85rem}
  }

  /* 全屏水印 */
  .site-watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22220%22%20height%3D%22160%22%3E%0A%20%20%3Ctext%20x%3D%2220%22%20y%3D%2280%22%20font-size%3D%2212%22%20fill%3D%22%23000000%22%20fill-opacity%3D%220.05%22%20font-family%3D%22Microsoft%20YaHei%2C%20sans-serif%22%20transform%3D%22rotate%2825%2C%20110%2C%2080%29%22%3E%E4%B9%9D%E5%B0%8F%E5%8D%BF%E6%94%BB%E7%95%A5%E7%AB%99%3C/text%3E%0A%3C/svg%3E");background-repeat:repeat;opacity:1}

  /* 禁止复制 */
  body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}

</style>
</head>
<body>
<div class="site-watermark"></div>
<div class="wrap">
  <a href="index.html?skipIntro=1#convenient" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    返回首页
  </a>
  <a href="conv_8.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    智能客服
  </a>
  <div class="page-title"><h1>智能理包</h1></div>

  <div class="section">
    <div class="purple-header">功能介绍</div>
    <p class="doc-text">先点击左侧小齿轮，进去后勾选需要的功能，勾选好后保存在点右侧的整理即可</p>
    <div class="doc-img"><img src="art/zhineng_libao/libao_2.png" alt="功能介绍"></div>
  </div>

  <div class="section">
    <div class="purple-header">功能优化</div>
    <p class="doc-text">修复了智能整理的功能，勾选后在整理更便捷</p><div class="doc-img"><img src="art/zhineng_libao/libao_3.png" alt="功能优化" loading="lazy"></div>
  </div>

  <div class="section">
    <div class="purple-header">新增物品栏</div>
    <p class="doc-text">新增了很多单独的物品栏，后续获得对应类的物品会直接存到对应的背包中！</p><div class="doc-img"><img src="art/zhineng_libao/libao_4.png" alt="新增物品栏" loading="lazy"></div>
  </div>

  <div class="footer">九小卿攻略站
</div>
</div>

<script>
document.addEventListener('copy',function(e){e.preventDefault();alert('禁止复制');});
document.addEventListener('cut',function(e){e.preventDefault();alert('禁止复制');});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>

</body>
</html>
