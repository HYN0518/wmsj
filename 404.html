<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 这个页面出去玩了</title>
<link rel="icon" type="image/jpeg" href="art/favicon.jpg">
<style>
  :root{
    --bg:#faf6ef; --ink:#16130f; --muted:#6f675c;
    --pink:#ff4d8d; --violet:#8b5cf6;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;
  }
  .code{
    font-size:clamp(6rem,24vw,12rem);font-weight:900;letter-spacing:-.04em;line-height:1;
    background:linear-gradient(92deg,var(--pink) 20%,var(--violet) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:clamp(1.3rem,4vw,2rem);font-weight:800;margin:14px 0 8px;letter-spacing:-.01em}
  p{color:var(--muted);margin-bottom:30px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);color:#fff;border-radius:999px;
    padding:14px 30px;font-weight:700;text-decoration:none;font-size:1rem;
    transition:transform .2s, box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(22,19,15,.3)}

  /* 全屏水印 */
  .site-watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22220%22%20height%3D%22160%22%3E%0A%20%20%3Ctext%20x%3D%2220%22%20y%3D%2280%22%20font-size%3D%2212%22%20fill%3D%22%23000000%22%20fill-opacity%3D%220.05%22%20font-family%3D%22Microsoft%20YaHei%2C%20sans-serif%22%20transform%3D%22rotate%2825%2C%20110%2C%2080%29%22%3E%E4%B9%9D%E5%B0%8F%E5%8D%BF%E6%94%BB%E7%95%A5%E7%AB%99%3C/text%3E%0A%3C/svg%3E");background-repeat:repeat;opacity:1}

  /* 禁止复制 */
  body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}

</style>
</head>
<body>
<div class="site-watermark"></div>
<main>
  <div class="code">404</div>
  <h1>这个页面出去玩了，还没回来。</h1>
  <p>先回首页看看别的局吧。</p>
  <a class="btn" href="./index.html">⚡ 回首页</a>
</main>

<script>
document.addEventListener('copy',function(e){e.preventDefault();alert('禁止复制');});
document.addEventListener('cut',function(e){e.preventDefault();alert('禁止复制');});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>

</body>
</html>
