<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>门派介绍 — 九小卿攻略站</title>
<meta name="description" content="九小卿门派介绍">
<link rel="icon" type="image/jpeg" href="art/favicon.jpg">
<style>
  :root{
    --bg:#ffffff;
    --ink:#16130f;
    --muted:#6f675c;
    --card:#ffffff;
    --pink:#ff4d8d;
    --blue:#4d7cff;
    --violet:#8b5cf6;
    --lime:#cdf05a;
    --orange:#ff8a3d;
    --gold:#f59e0b;
    --radius:24px;
    --shadow:0 12px 32px rgba(22,19,15,.10);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;scrollbar-gutter:stable;background:var(--bg)}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    overflow-x:hidden;
  }
  ::selection{background:var(--pink);color:#fff}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  button{font-family:inherit}

  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}

  .grad{
    background:linear-gradient(92deg,#ff9ec6 10%,#c4b5fd 45%,#93c5fd 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 28px;border-radius:999px;border:none;cursor:pointer;
    font-weight:700;font-size:.95rem;line-height:1;
    transition:transform .2s, box-shadow .2s, background .2s;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .btn-dark{background:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(22,19,15,.25)}
  .btn-dark:hover{box-shadow:0 10px 24px rgba(22,19,15,.3)}
  .btn-ghost{background:transparent;border:2px solid var(--ink);color:var(--ink)}
  .btn-ghost:hover{background:var(--ink);color:#fff}
  .btn-lime{background:var(--lime);color:var(--ink);box-shadow:0 8px 22px rgba(205,240,90,.5)}
  .btn-orange{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(255,138,61,.35)}

  /* ===== 新功能·横幅卡 ===== */
  /* 首页四卡（面饰/腰饰/天命/悟道） */
  .feature-showcase{max-width:920px;margin:0 auto;padding:8px 0}
  .showcase-character{min-width:0}
  .showcase-character .char-figure{width:min(460px,78vw)}
  @media (max-width:768px){
    .feature-showcase{padding:0}
  }
  /* ===== 跑马灯 ===== */
  .marquee{
    border-top:1.5px solid rgba(22,19,15,.08);
    border-bottom:1.5px solid rgba(22,19,15,.08);
    overflow:hidden;padding:14px 0;background:#fff;
  }
  .marquee-track{display:flex;width:max-content;animation:mqScroll 32s linear infinite}
  .marquee:hover .marquee-track{animation-play-state:paused}
  @keyframes mqScroll{to{transform:translateX(-50%)}}
  .marquee-group{display:flex;align-items:center;gap:32px;padding-right:32px;font-weight:800;font-size:1rem;letter-spacing:.02em;white-space:nowrap}
  .marquee-group i{font-style:normal;color:var(--pink)}
  .mq-item{display:inline-flex;align-items:center;gap:6px}
  .mq-item img{width:22px;height:22px;object-fit:contain;vertical-align:middle}

  /* 首页板块标题与优化痛点 */
  .home-banner-wrap{position:relative}
  .home-banner{display:block;width:100%;height:auto;margin:0}
  .bag-egg-hotspot{
    position:absolute;left:3.4%;top:69%;z-index:4;
    width:11.2%;height:16%;min-width:44px;min-height:44px;
    padding:0;border:0;border-radius:14px;appearance:none;
    background:transparent;cursor:pointer;outline:none;
  }
  .bag-egg-modal{
    position:fixed;inset:0;z-index:260;display:grid;place-items:center;padding:20px;
    background:rgba(16,38,61,.56);backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .24s ease;
  }
  .bag-egg-modal.show{opacity:1;pointer-events:auto}
  .bag-egg-card{
    position:relative;width:min(430px,calc(100vw - 32px));box-sizing:border-box;
    padding:34px 34px 28px;border:1px solid rgba(67,150,221,.38);border-radius:8px;
    background:linear-gradient(180deg,#fff 0%,#f4fbff 100%);
    box-shadow:0 24px 70px rgba(8,42,76,.32);
    color:#173754;text-align:center;
    transform:translateY(18px) scale(.94);opacity:0;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .24s ease;
  }
  .bag-egg-modal.show .bag-egg-card{transform:translateY(0) scale(1);opacity:1}
  .bag-egg-card::before{
    content:"";position:absolute;inset:7px;border:1px solid rgba(87,167,228,.2);
    border-radius:5px;pointer-events:none;
  }
  .bag-egg-close{
    position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;
    display:grid;place-items:center;padding:0;border:0;background:transparent;
    color:#66839a;font-size:1.4rem;line-height:1;cursor:pointer;
    transition:color .2s,transform .2s;
  }
  .bag-egg-close:hover{color:#176eb0;transform:rotate(90deg)}
  .bag-egg-mark{
    width:58px;height:58px;margin:0 auto 12px;display:grid;place-items:center;
    border-radius:50%;background:#e8f6ff;border:1px solid #b8ddf7;
    font-size:1.85rem;box-shadow:0 8px 22px rgba(48,139,207,.16);
  }
  .bag-egg-kicker{font-size:.7rem;font-weight:800;color:#3286c7;letter-spacing:.14em}
  .bag-egg-card h2{margin:7px 0 12px;font-size:1.42rem;letter-spacing:0;color:#173754}
  .bag-egg-copy{margin:0;color:#61788a;font-size:.9rem;line-height:1.75}
  .bag-egg-note{
    margin:16px 0;padding:13px 14px;border-left:3px solid #57aee8;
    background:rgba(222,243,255,.65);color:#315b79;font-size:.88rem;line-height:1.7;text-align:left;
  }
  .bag-egg-loot{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:0 0 10px}
  .bag-egg-loot span{
    padding:5px 9px;border:1px solid #c9e6f8;border-radius:999px;
    background:#fff;color:#2d739f;font-size:.72rem;font-weight:800;
  }
  .bag-egg-disclaimer{margin:0 0 17px;color:#8aa0af;font-size:.68rem}
  .bag-egg-accept{
    position:relative;z-index:1;min-width:140px;padding:10px 20px;border:0;border-radius:6px;
    background:#217fbe;color:#fff;font-family:inherit;font-size:.88rem;font-weight:800;
    cursor:pointer;box-shadow:0 8px 18px rgba(33,127,190,.25);
    transition:background .2s,transform .2s;
  }
  .bag-egg-accept:hover{background:#176ba4;transform:translateY(-1px)}
  /* 下滑指示（仅 PC 端，悬于横幅底部） */
  .hero-scroll{
    display:none;
    position:absolute;left:50%;bottom:calc(2vh + 88px);transform:translateX(-50%);z-index:3;
    width:max-content;
    flex-direction:column;align-items:center;gap:7px;
    background:none;border:none;cursor:pointer;padding:6px 18px;
    color:#fff;font-weight:700;font-size:clamp(14px,1.3vw,19px);
    letter-spacing:.35em;text-indent:.35em;
    text-shadow:0 2px 12px rgba(0,0,0,.55);
    font-family:inherit;
  }
  .hs-row{display:flex;align-items:center;gap:16px}
  .hs-line{
    width:clamp(80px,9vw,140px);height:8px;
    background-image:radial-gradient(circle,rgba(255,255,255,.95) 2px,transparent 2.6px);
    background-size:12px 8px;background-repeat:repeat-x;
  }
  .hs-l{animation:dotMarchL 1.1s linear infinite}
  .hs-r{animation:dotMarchR 1.1s linear infinite}
  @keyframes dotMarchL{from{background-position-x:0}to{background-position-x:12px}}
  @keyframes dotMarchR{from{background-position-x:12px}to{background-position-x:0}}
  .hs-chevron{
    width:14px;height:14px;margin-top:2px;
    border-right:3px solid #fff;border-bottom:3px solid #fff;
    transform:rotate(45deg);
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
    animation:chevBob 1.4s ease-in-out infinite;
  }
  @keyframes chevBob{
    0%,100%{opacity:.45;transform:rotate(45deg) translate(0,0)}
    50%{opacity:1;transform:rotate(45deg) translate(3px,3px)}
  }
  @media (min-width:961px){
    .hero-scroll{display:flex}
  }
  .home-sec-title-img{display:block;width:min(520px,76vw);height:auto;margin:0 auto 18px}
  .home-guide-row{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(4px,1.5vw,18px);max-width:1180px;margin:0 auto clamp(24px,4vw,42px)
  }
  .home-guide-card{
    display:block;min-width:0;overflow:hidden;
    filter:drop-shadow(0 8px 18px rgba(22,19,15,.12));
    transition:transform .25s ease,filter .25s ease
  }
  .home-guide-card img{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:contain}
  .home-guide-card:hover{transform:translateY(-5px);filter:drop-shadow(0 13px 25px rgba(22,19,15,.2))}
  .home-guide-card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  @media (max-width:600px){
    .home-guide-row{gap:4px;margin-bottom:24px}
    .home-guide-card{filter:drop-shadow(0 4px 8px rgba(22,19,15,.1))}
  }
  .char-figure{position:relative;width:min(460px,78vw);margin:0 auto}
  .char-standing{position:relative;z-index:1;display:block;width:min(340px,62vw);height:auto;margin:0 auto 8px}
  .char-guide{position:absolute;z-index:3;display:flex;align-items:center;color:#c9448f;font-size:.88rem;font-weight:800;white-space:nowrap;pointer-events:none}
  .char-guide.right{flex-direction:row}
  .cg-preview{width:68px;height:68px;flex:0 0 68px;display:grid;place-items:center;overflow:hidden;border:3px solid #cf5a9d;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(201,68,143,.18)}
  .cg-preview img{display:block;width:82%;height:82%;object-fit:contain}
  a.cg-preview{pointer-events:auto;cursor:pointer;transition:transform .2s,box-shadow .2s}
  a.cg-preview:hover{transform:scale(1.08);box-shadow:0 6px 18px rgba(201,68,143,.32)}
  .cg-line{width:76px;height:2px;background:#cf5a9d}
  .cg-label{position:absolute;bottom:calc(50% + 5px);width:76px;text-align:center;text-shadow:0 1px #fff}
  .char-guide:not(.right) .cg-label{left:68px}
  .char-guide.right .cg-label{right:68px}
  .cg-head{right:11px;top:4%}
  .cg-hand{left:-12px;top:22%}
  .cg-waist{right:22px;top:46%}
  .cg-rank{left:-18px;bottom:-63px}
  @media (max-width:768px){
    .char-guide{display:flex;transform:scale(.72)}
    .cg-head,.cg-waist{transform-origin:right center}
    .cg-hand,.cg-rank{transform-origin:left center}
    .cg-head{right:-4px}
    .cg-hand{left:-18px}
    .cg-waist{right:0}
    .cg-rank{left:-20px;bottom:-48px}
  }
  .char-nameplate{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 auto 20px}
  .cn-label{width:72px;height:auto;display:block}
  .cn-name{font-size:1.5rem;font-weight:900;color:#3ddc3d;letter-spacing:.08em;
    text-shadow:0 0 10px rgba(61,220,61,.55),0 1px 2px rgba(0,0,0,.4)}
  .home-sec-title{max-width:920px;margin:0 auto 16px;font-size:1.12rem;font-weight:900;color:#4a3319;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
  .home-sec-title::before{content:"";flex-shrink:0;width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#f0b13e,#dd8f1f)}
  .home-sec-title.pain-mt{margin-top:36px}
  .pain-title-img{display:block;width:min(520px,76vw);height:auto;margin:36px auto 18px}
  .pain-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1180px;margin:0 auto}
  .pain-card{background:#fff;border:1.5px solid rgba(180,140,80,.28);border-radius:12px;padding:13px 14px 12px;box-shadow:0 3px 10px rgba(150,110,60,.08)}
  .pain-card h4{font-size:.92rem;font-weight:800;color:#4a3319;display:flex;align-items:center;gap:7px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px dashed rgba(180,140,80,.35)}
  .pain-card .pc-ic{font-size:1.05rem;line-height:1}
  .pain-card ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .pain-card li{font-size:.78rem;color:#7a5b36;line-height:1.6;padding-left:12px;position:relative}
  .pain-card li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--pc,#f59e0b)}
  .pain-card b{color:#4a3319}
  @media (max-width:960px){.pain-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:600px){
    .pain-grid{
      grid-template-columns:none;
      grid-auto-flow:column;
      grid-auto-columns:calc(100% - 40px);
      align-items:start;
      gap:10px;
      overflow-x:auto;
      overscroll-behavior-inline:contain;
      scroll-snap-type:x mandatory;
      scroll-padding-inline:2px;
      padding:2px 2px 10px;
      scrollbar-width:none;
      -ms-overflow-style:none;
      -webkit-overflow-scrolling:touch;
    }
    .pain-grid::-webkit-scrollbar{display:none}
    .pain-card{scroll-snap-align:start;scroll-snap-stop:always}
    .pain-card li{font-size:.8rem}
  }

  .nf-head,.ch-head,.cv-head{display:block;width:min(345px,57vw);height:auto;margin:0 auto 26px;
    filter:drop-shadow(0 10px 20px rgba(31,148,160,.35))}
  .nf-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:1180px;margin:0 auto}
  .nf-card{text-decoration:none;color:inherit;display:block;flex:0 1 calc((100% - 40px)/3);min-width:240px;cursor:pointer;
    filter:drop-shadow(0 10px 22px rgba(22,19,15,.16));
    transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .3s ease}
  .nf-card img{display:block;width:100%;height:auto;aspect-ratio:428/291}
  .nf-card:hover{transform:translateY(-8px);filter:drop-shadow(0 18px 36px rgba(22,19,15,.26))}
  .nf-hint{text-align:center;margin-top:16px;font-size:.85rem;color:var(--muted);font-weight:600}
  .nf-extra-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;max-width:900px;margin:0 auto 24px}
  .nf-extra-card{text-decoration:none;color:inherit;display:block;flex:0 1 400px;min-width:0;cursor:pointer;
    filter:drop-shadow(0 10px 22px rgba(22,19,15,.16));
    transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .3s ease}
  .nf-extra-card img{display:block;width:100%;height:auto}
  .nf-extra-card:hover{transform:translateY(-8px);filter:drop-shadow(0 18px 36px rgba(22,19,15,.26))}
  @media (max-width:768px){
    .nf-extra-wrap{gap:12px;max-width:100%}
    .nf-extra-card{flex:0 1 calc((100% - 12px)/2)}
  }

  /* 新功能·移动端轮播 */
  .nf-carousel{display:none}
  .nf-stage{position:relative;overflow:hidden;touch-action:pan-y;cursor:grab}
  .nf-stage:active{cursor:grabbing}
  .nf-slide{position:absolute;top:0;left:0;width:86%;will-change:transform;
    transition:transform .5s cubic-bezier(.4,0,.2,1),filter .45s ease,opacity .35s ease}
  .nf-slide img{display:block;width:100%;height:auto}
  .nf-meta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;min-height:34px}
  .nf-meta b{font-size:2rem;font-weight:900;color:#ef6a5f;line-height:1;letter-spacing:.02em}
  .nf-meta span{font-weight:800;color:#1c2740;font-size:.95rem}
  .nf-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin-top:8px;max-width:100%}
  .nf-dot{background:none;border:0;padding:2px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:inherit}
  .nf-dot i{width:12px;height:12px;border-radius:50%;border:2px solid #f0b429;background:transparent;transition:background .25s,transform .25s}
  .nf-dot.on i{background:#f0b429;transform:scale(1.12)}
  .nf-dot span{font-size:.58rem;color:#8a97a8;font-weight:700;white-space:nowrap}
  .nf-dot.on span{color:#1c2740}
  @media (prefers-reduced-motion:reduce){.nf-slide{transition:none}}

  /* ===== 玩法入口横幅 ===== */
  .cat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:1180px;margin:0 auto}
  .cat-card{text-decoration:none;color:inherit;display:block;flex:0 1 calc((100% - 60px)/4);min-width:200px;
    filter:drop-shadow(0 10px 22px rgba(22,19,15,.16));
    transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .3s ease}
  .cat-card img{display:block;width:100%;height:auto;aspect-ratio:1440/2560}
  .cat-card:hover{transform:translateY(-8px);filter:drop-shadow(0 18px 36px rgba(22,19,15,.26))}

  /* ===== 活动日程 ===== */
  .evt-panel{max-width:1080px;margin:0 auto}
  .evt-head-img{
    display:block;width:100%;height:auto;
    filter:drop-shadow(0 8px 18px rgba(22,19,15,.2));
    position:relative;z-index:2}
  .evt-frame{
    margin-top:-8px;position:relative;
    background:linear-gradient(180deg,#fbf3e0,#f6ecd4);
    border:2px solid #d8b98c;border-radius:12px;
    box-shadow:0 18px 44px rgba(22,19,15,.14);
    padding:18px;display:flex;gap:16px}
  .evt-frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(180,140,80,.35);border-radius:8px;pointer-events:none}
  .evt-sidebar{flex-shrink:0;width:150px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
  /* 分组通排标题（活动页无侧栏版式） */
  .evt-sec-h{margin:20px 2px 10px;font-weight:800;font-size:.95rem;color:#7a5b36;display:flex;align-items:center;gap:10px;letter-spacing:.05em}
  .evt-sec-h::after{content:"";flex:1;height:1px;background:rgba(180,140,80,.35)}
  .evt-main-wrap .evt-sec-h:first-child{margin-top:2px}
  .evt-side-btn{
    appearance:none;border:1.5px solid #d8b98c;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,#fffaf0,#f7ecd2);
    color:#7a5b36;font-weight:800;font-size:.88rem;letter-spacing:.06em;
    padding:11px 10px;text-align:left;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 5px rgba(150,110,60,.15),inset 0 1px 0 #fff;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,background .22s,color .22s}
  .evt-side-btn:hover{transform:translateX(3px);border-color:#e8b04b;box-shadow:0 4px 10px rgba(150,110,60,.2)}
  .evt-side-btn.active{
    background:linear-gradient(180deg,#f4737f,#e04052 60%,#c93243);
    border-color:#f9b4c0;color:#fff;text-shadow:0 1px 2px rgba(120,20,25,.4);
    box-shadow:0 4px 10px rgba(224,64,82,.3),inset 0 1px 0 rgba(255,255,255,.3)}
  .evt-side-count{font-size:.7rem;font-weight:700;opacity:.7}
  .evt-main-wrap{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
  .evt-search-bar input{
    width:100%;padding:10px 16px;border:1.5px solid #e2c9a0;border-radius:10px;
    background:linear-gradient(180deg,#fffef8,#fdf6e6);color:#4a3319;font-size:.9rem;
    outline:none;transition:border-color .2s,box-shadow .2s}
  .evt-search-bar input:focus{border-color:#e8a33d;box-shadow:0 0 0 3px rgba(232,163,61,.15)}
  .evt-search-bar input::placeholder{color:#b8a080}
  .evt-main{
    background:linear-gradient(180deg,#fefaf0,#faf2de);
    border:1.5px solid #e2c9a0;border-radius:10px;
    padding:14px;height:420px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:#d8b98c transparent;
    animation:evtFade .3s ease}
  .evt-main::-webkit-scrollbar{width:8px}
  .evt-main::-webkit-scrollbar-thumb{background:#d8b98c;border-radius:99px}
  .evt-main::-webkit-scrollbar-track{background:transparent}
  @keyframes evtFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .evt-icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 10px}
  .evt-icon-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s;gap:6px}
  .evt-icon-item:hover{transform:translateY(-3px)}
  .evt-icon-avatar{
    width:72px;height:72px;border-radius:50%;
    background:linear-gradient(135deg,#fff5e0,#f5e6c8);
    border:2px solid #e2c9a0;display:flex;align-items:center;justify-content:center;

  /* ===== 人物提升·星轨 ===== */
  .orbit-panel{
    position:relative;
    aspect-ratio:1000/640;
  }
  .orbit-ring{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(110,175,255,.45))}
  .orbit-nodes{position:absolute;inset:0}
  .orbit-node{
    text-decoration:none;
    color:inherit;
    position:absolute;
    left:0;
    top:0;
    width:var(--node-s,54px);
    height:var(--node-s,54px);
    transform:translate(-50%,-50%);
    cursor:pointer;
    z-index:3;
    will-change:transform
  }
  .on-disc{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--node-s,54px)*.62);
    filter:drop-shadow(0 2px 6px rgba(30,50,90,.16));
    transition:transform .22s ease,filter .22s ease}
  .on-disc img{width:100%;height:100%;object-fit:contain;display:block}
  .orbit-node:hover .on-disc{transform:scale(1.15);filter:drop-shadow(0 0 12px rgba(120,180,255,.6))}
  .on-name{position:absolute;bottom:calc(100% + 24px);left:50%;transform:translateX(-50%);white-space:nowrap;
    color:#1c2740;font-weight:800;font-size:.92rem;letter-spacing:.04em;text-shadow:0 1px 0 rgba(255,255,255,.7)}
  .on-sub{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);white-space:nowrap;
    color:#5c7dab;font-size:.68rem;letter-spacing:.08em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .on-pillar{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);width:2px;height:44px;
    background:linear-gradient(180deg,rgba(100,150,225,.55),rgba(100,150,225,0));border-radius:2px}
  /* 人物提升·移动端条幅 */
  .char-scroll{display:none;position:relative;max-width:400px;margin:0 auto}
  .cs-bg{display:block;width:100%;height:auto;aspect-ratio:820/801}
  .cs-cols{position:absolute;inset:0;pointer-events:none}
  .cs-col{position:absolute;width:18%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;pointer-events:auto}
  .cs-col.c0{left:13.9%;top:17.5%;height:71%}
  .cs-col.c1{left:42.2%;top:15.5%;height:70%}
  .cs-col.c2{left:68.6%;top:15%;height:72%}
  .cs-item{
    text-decoration:none;
    color:inherit;
    background:none;
    border:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    cursor:pointer;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent
  }
  .cs-ico{width:34px;height:34px;display:grid;place-items:center;font-size:22px;
    filter:drop-shadow(0 2px 4px rgba(30,50,90,.18));transition:transform .2s ease}
  .cs-ico img{width:100%;height:100%;object-fit:contain;display:block}
  .cs-name{font-size:.6rem;font-weight:700;color:#3d5a86;white-space:nowrap;line-height:1.1;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .cs-item:active .cs-ico{transform:scale(1.12)}
  .orbit-core{position:absolute;left:50%;top:var(--core-y,60%);transform:translate(-50%,-50%);width:24%;aspect-ratio:1;z-index:2}
  .core-halo{position:absolute;inset:-26%;border-radius:50%;
    background:radial-gradient(circle,rgba(110,190,255,.28),rgba(110,190,255,.10) 46%,transparent 72%);
    animation:corePulse 4.5s ease-in-out infinite}
  @keyframes corePulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  .core-ring{position:absolute;inset:0;border-radius:50%;
    border:2px solid rgba(110,160,230,.5);
    background:radial-gradient(circle,rgba(130,190,255,.18),rgba(130,190,255,.06) 55%,transparent 78%);
    box-shadow:0 0 30px rgba(110,165,240,.28),inset 0 0 26px rgba(110,165,240,.16)}
  .core-char{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);height:135%;width:auto;max-width:none;
    filter:drop-shadow(0 0 30px rgba(84,225,190,.4));z-index:2;pointer-events:none}
  #ringDash{stroke-dasharray:5 9;animation:dashDrift 26s linear infinite}
  @keyframes dashDrift{to{stroke-dashoffset:-140}}
  .orbit-dot{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:2;will-change:transform}
  .orbit-dot.d0{background:radial-gradient(circle at 35% 35%,#fff,#ffd27a 55%,#f59e0b);box-shadow:0 0 10px rgba(245,158,11,.75)}
  .orbit-dot.d1{background:radial-gradient(circle at 35% 35%,#fff,#9cc4f8 55%,#5a94e8);box-shadow:0 0 10px rgba(90,148,232,.75)}
  .orbit-dot.d2{background:radial-gradient(circle at 35% 35%,#fff,#8fe6d8 55%,#3fbfa8);box-shadow:0 0 10px rgba(63,191,168,.75)}

  /* ===== 应用壳·左侧竖栏布局 ===== */
  html{overflow-x:hidden}
  .app{display:flex;min-height:100vh}
  /* 首页（Hero）不显示左侧竖栏，全屏沉浸 */
  body.rail-off .rail{display:none}

  @media (min-width:961px){
    body.rail-off .main{margin-left:0}
  }
  /* 门派竖栏：底部选中「门派」时替换默认竖栏 */
  #sectRail{display:none}
  body.rail-sects #sectRail{display:flex}
  body.rail-sects #rail{display:none}
  /* 活动页：不显示左侧默认竖栏 */
  body.rail-events #rail{display:none}

  @media (min-width:961px){
    body.rail-events .main{margin-left:0}

  #events{

  #events .wrap,#events .evt-panel,#events .evt-frame,#events .evt-main{min-width:0}
  #events .wrap{width:100%;box-sizing:border-box}
  /* 移动端：左侧竖栏避开底部五栏导航，避免最下面的图标被遮住 */
  @media (max-width:960px){
    body:not(.rail-off) .rail{bottom:calc(56px + env(safe-area-inset-bottom,0px))}

  .sect-emoji{font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(22,19,15,.15))}

  .sect-art{
    width:34px;height:34px;border-radius:10px;overflow:hidden;position:relative;flex-shrink:0;display:block;

  /* 门派面板 · 发现页式布局：视频横幅 + 卡片流（点卡片直接在页内展开内容） */

/* 无 detail 数据的门派：用 skill/tags 生成模板数据 */
function deriveDetail(s){
  const chars=s.chars.filter(Boolean);
  const skills=[
    {icon:s.charArt,name:s.skill.name,desc:s.skill.effect,limit:'门派主动'},
    {icon:'📜',name:'门派心法',desc:s.skill.intro,limit:'被动'},
    ...s.tags.map((t,i)=>({icon:chars[i%chars.length]||s.charArt,name:t,desc:`${s.name}弟子的核心成长特性：${t}。`,limit:'特性'})),
    {icon:'🌟',name:s.skill.name+'·极',desc:(s.skill.upgrade||'').replace(/^0-120级\s*/,'')+'，满级后效果翻倍。',limit:'觉醒'}
  ];
  return {
    skills,
    reincarnation:skills.slice(0,6).map(k=>({name:'满级·'+k.name,desc:`${k.name}强化至圆满，效果显著提升。`}))
  };
}

/* ===== 门派面板 · 发现页式布局（视频横幅 + 分类标签栏，点标签直接切换内容） ===== */
const SECT_CATS=[
  {key:'skills', name:'门派技能', icon:'icons/book_skill.png',    note:'技能效果一览'},
  {key:'reinc',  name:'轮回天书', icon:'icons/scroll_tianshu.png', note:'满级技能强化'},
  {key:'awaken', name:'觉醒时装', icon:'icons/shizhuang.png',     note:'集齐300碎片合成'},
  {key:'wing',   name:'羽翼技能', icon:'icons/yuyi.png',          note:'技能搭配，仅供参考'},
  {key:'enchant',name:'门派附魔', icon:'icons/fumo.png',          note:'各星级属性范围'},
  {key:'equip',  name:'装备属性', icon:'icons/wuqi.png',          note:'属性数值范围'},
];
let curSectObj=null,curSectData=null,sectOpenCat=null;
function renderSectDetail(idx){
  const el=document.getElementById('sectDetail');
  const s=SECTS[idx];
  const d=s.detail||deriveDetail(s);
  curSectObj=s;curSectData=d;sectOpenCat=null;
  el.className='sect-detail in';
  el.innerHTML=`
      <div class="sect-hero">
        <video class="sect-hero-video" src="art/sect_intro.mp4" autoplay muted loop playsinline></video>
      </div>
      <div class="sect-tabs" id="sectTabs"></div>
      <div id="sectCatPanel"></div>`;
  /* SECT_AWAKEN 等数据表声明在后方，延迟到脚本执行完毕再渲染 */
  queueMicrotask(()=>{
    const first=SECT_CATS.find(c=>sectCatCount(c.key)>0);
    if(first) selectSectCat(first.key);
  });
}
function sectCatCount(key){
  const s=curSectObj,d=curSectData;
  if(!s||!d) return 0;
  if(key==='skills') return (d.skills||[]).length;
  if(key==='reinc') return (d.reincarnation||[]).length;
  const T={awaken:SECT_AWAKEN,wing:SECT_WING,enchant:SECT_ENCHANT,equip:SECT_EQUIP}[key];
  const arr=T&&T[s.name];
  return arr?arr.length:0;
}
function renderSectTabs(activeKey){
  const bar=document.getElementById('sectTabs');
  if(!bar) return;
  bar.innerHTML=SECT_CATS.filter(c=>sectCatCount(c.key)>0).map(c=>
    `<button class="sect-tab${activeKey===c.key?' active':''}" onclick="selectSectCat('${c.key}')">
      <img src="${c.icon}" alt="" loading="lazy">${c.name}
    </button>`).join('');
}
function sectCatBody(key){
  const d=curSectData,s=curSectObj;
  if(key==='skills'){
    return `<div class="skill-list">${d.skills.map(sk=>`
      <div class="skill-card">
        <div class="skill-c-head">${sk.img?`<img class="skill-c-ico" src="${sk.img}" alt="" loading="lazy">`:''}<span class="skill-c-name">${sk.name}</span>${sk.limit&&sk.limit!=='不限'?`<span class="skill-c-limit">${sk.limit}</span>`:''}</div>
        <div class="skill-c-desc">${sk.desc}</div>
      </div>`).join('')}</div>`;
  }
  if(key==='reinc'){
    return `<div class="skill-list">${buildReincItems(d).map(r=>`
      <div class="skill-card">
        <div class="skill-c-head"><img class="skill-c-ico" src="${r.img}" alt="" loading="lazy"><span class="skill-c-name">${r.name}</span><span class="skill-c-limit">满级</span></div>
        <div class="skill-c-desc">${r.desc}</div>
      </div>`).join('')}</div>`;
  }
  return buildExtrasHTML(key,s.name);
}
/* 点标签：直接切换到该板块内容，无需二次点击 */
function selectSectCat(key){
  const panel=document.getElementById('sectCatPanel');
  if(!panel) return;
  const c=SECT_CATS.find(x=>x.key===key);
  const body=sectCatBody(key);
  if(!c||!body) return;
  sectOpenCat=key;
  renderSectTabs(key);
  /* 只对标签栏自身做横向滚动（scrollIntoView 会连带滚动页面容器导致页面左偏） */
  requestAnimationFrame(()=>{
    const bar=document.getElementById('sectTabs');
    const ab=bar&&bar.querySelector('.sect-tab.active');
    if(bar&&ab) bar.scrollTo({left:Math.max(0,ab.offsetLeft-(bar.clientWidth-ab.offsetWidth)/2),behavior:'smooth'});
  });
  panel.innerHTML=`
    <div class="ref-block sect-cat-block">
      <div class="ref-block-h"><span class="ref-ico"><img class="ref-ico-img" src="${c.icon}" alt="" loading="lazy"></span>${c.name}<span class="ref-note">${c.note}</span></div>
      ${body}
    </div>`;
}

/* ===== 觉醒时装/羽翼技能/门派附魔/装备属性 · 卡片 HTML（只留名字+效果，不带图标） ===== */
const cardHead=(name,chip)=>`<div class="skill-c-head"><span class="skill-c-name">${name}</span>${chip?`<span class="skill-c-limit">${chip}</span>`:''}</div>`;
function buildExtrasHTML(key,name){
  if(key==='awaken'){
    const aw=SECT_AWAKEN[name];
    if(!aw||!aw.length) return '';
    return `<div class="skill-list">${aw.map(r=>`
      <div class="skill-card">${cardHead(r.name,r.tier)}<div class="skill-c-desc">${r.desc}</div></div>`).join('')}</div>`;
  }
  if(key==='wing'){
    const wg=SECT_WING[name];
    if(!wg||!wg.length) return '';
    return `<div class="skill-list">${wg.map(r=>`
      <div class="skill-card">${cardHead(r.name,r.lv?(r.lv+'').replace(/(阶|\s)+$/,'')+'阶':'')}<div class="skill-c-desc">${r.desc}</div></div>`).join('')}</div>`;
  }
  if(key==='enchant'){
    const en=SECT_ENCHANT[name];
    if(!en||!en.length) return '';
    return `<div class="skill-list">${en.map(item=>`
      <div class="skill-card">${cardHead(item.name,'')}<div class="skill-c-desc">${item.desc}${item.stars.map(s=>`<br><b>${s.star}</b>：${s.min} ~ ${s.max}`).join('')}</div></div>`).join('')}</div>`;
  }
  if(key==='equip'){
    const eq=SECT_EQUIP[name];
    if(!eq||!eq.length) return '';
    const card=r=>`
      <div class="skill-card">${cardHead(r.name,(+r.lv)+'级')}<div class="skill-c-desc">${r.type}<br>属性A：${r.aMin} ~ ${r.aMax}<br>属性B：${r.bMin} ~ ${r.bMax}</div></div>`;
    const pick=g=>eq.filter(x=>x.char.endsWith(g)).sort((a,b)=>+a.lv-+b.lv);
    /* PC 双列并排；移动端通过男女切换按钮单列显示 */
    return `<div class="equip-gender-toggle">
      <button class="egt-btn active" onclick="switchEquipGender(this,'m')">男</button>
      <button class="egt-btn" onclick="switchEquipGender(this,'f')">女</button>
    </div>
    <div class="equip-cols g-m" id="equipCols">
      <div class="equip-col equip-col-m"><div class="equip-col-h">男</div>${pick('男').map(card).join('')}</div>
      <div class="equip-col equip-col-f"><div class="equip-col-h">女</div>${pick('女').map(card).join('')}</div>
    </div>`;
  }
  return '';
}
/* 装备属性 男女切换（移动端） */
function switchEquipGender(btn,g){
  const cols=document.getElementById('equipCols');
  if(!cols) return;
  cols.classList.toggle('g-m',g==='m');
  cols.classList.toggle('g-f',g==='f');
  btn.parentElement.querySelectorAll('.egt-btn').forEach(b=>b.classList.toggle('active',b===btn));
}

/* ===== 轮回天书 · 名字+效果卡片（同门派技能样式，带技能图标） ===== */
const REINC_ALIAS={'幽冥盾击':'icons/gw_tiangangzhanqi.png','厉鬼夺魂':'icons/gw_liguiduopo.png','碎玉剑决':'icons/qy_suiyujianjue.png','御灵狩魂':'icons/YY_Skill016.png'};
function buildReincItems(d){
  return (d.reincarnation||[]).map(r=>{
    const base=r.name.replace(/^满级·/,'');
    const hit=(d.skills||[]).find(s=>s.name===base);
    return {name:base,desc:r.desc,img:hit&&hit.img?hit.img:(REINC_ALIAS[base]||'icons/scroll_tianshu.png')};
  });
}

function syncSectRail(idx){
  const btns=document.querySelectorAll('#sectRail .sect-btn');
  btns.forEach((b,i)=>b.classList.toggle('active',i===idx));
  const act=btns[idx];
  const rail=document.getElementById('sectRail');
  if(act&&rail&&document.body.classList.contains('rail-sects')){
    const top=act.offsetTop,bottom=top+act.offsetHeight;
    if(top<rail.scrollTop||bottom>rail.scrollTop+rail.clientHeight){
      rail.scrollTop=top-rail.clientHeight/2+act.offsetHeight/2;
    }
  }
}

(function renderSectRail(){
  const box=document.getElementById('sectRail');
  if(!box) return;
  SECTS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='rail-btn sect-btn';
    b.title=s.name;
    b.setAttribute('aria-label',s.name);
    b.style.setProperty('--sc',s.color||'');
    const emo=(s.icon&&/[^\uFE0E\uFE0F\u200D\s]/.test(s.icon))?s.icon:s.name.slice(0,1);
    /* 图标：门派徽章；缺失或加载失败时回退立绘裁头 / emoji */
    const art=document.createElement('span');
    art.className='sect-art';
    const emoFallback=document.createElement('span');
    emoFallback.className='sect-emoji';
    emoFallback.textContent=emo;
    const badge=SECT_BADGE[s.id];
    if(badge||(s.arts&&s.arts[0])){
      const img=document.createElement('img');
      img.src=badge||s.arts[0];
      img.alt='';
      img.loading='lazy';
      if(badge){
        img.className='sect-badge';
      }else{
        const crop=SECT_CROP[s.name];
        if(crop){img.style.left=crop.left;img.style.top=crop.top;}
      }
      img.onerror=()=>{art.replaceChildren(emoFallback);};
      art.appendChild(img);
    }else{
      art.appendChild(emoFallback);
    }
    const lab=document.createElement('span');
    lab.className='rail-label';
    lab.textContent=s.name;
    b.appendChild(art);b.appendChild(lab);
    b.addEventListener('click',()=>switchSect(i));
    box.appendChild(b);
  });
})();

})();
